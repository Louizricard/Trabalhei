# Configuração mínima do Supabase CLI para desenvolvimento local.
# Gere o restante com `supabase init` se precisar customizar portas/auth.
project_id = "trabalhei"

[api]
enabled = true

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# O webhook do Asaas não envia JWT do Supabase; a autenticação é feita pelo
# token compartilhado (ASAAS_WEBHOOK_TOKEN) validado dentro da função.
[functions.asaas-webhook]
verify_jwt = false

# Chamada pelo próprio banco (pg_net) sem JWT. Só entrega notificações recentes
# e ainda não entregues, então uma chamada repetida não envia nada de novo.
[functions.dispatch-notification]
verify_jwt = false

# Modelos de e-mail em português (os mesmos textos estão no painel do projeto).
[auth.email.template.confirmation]
subject = "Confirme seu cadastro no Trabalhei"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do Trabalhei"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao Trabalhei"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no Trabalhei"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Você foi convidado para o Trabalhei"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Código de confirmação do Trabalhei"
content_path = "./supabase/templates/reauthentication.html"
